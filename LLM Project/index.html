<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f8f6" />
    <meta name="description" content="A thoughtful AI chat workspace." />
    <title>Ollama Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <a class="brand" href="/" aria-label="Ollama Chat home">
            <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
            <span>ollama chat</span>
          </a>
          <button class="icon-button sidebar-close" id="closeSidebar" aria-label="Close sidebar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>

        <button class="new-chat-button" id="newChat">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>New chat</span>
          <span class="shortcut">⌘ K</span>
        </button>

        <div class="history-section">
          <p class="section-label">YOUR SPACE</p>
          <div class="history-list" id="historyList"></div>
          <p class="history-empty" id="historyEmpty">Your conversations will appear here.</p>
        </div>

        <div class="sidebar-bottom">
          <div class="profile-avatar">V</div>
          <div class="profile-copy"><strong>Guest</strong><span>Your personal workspace</span></div>
          <button class="icon-button profile-menu" aria-label="Account options">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
          </button>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <button class="icon-button menu-button" id="openSidebar" aria-label="Open sidebar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div class="model-picker-wrap">
            <select class="model-picker" id="modelPicker" aria-label="Choose model">
              <option>Loading models…</option>
            </select>
            <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
          </div>
          <div class="topbar-right">
            <span class="connection-status" id="connectionStatus"><span class="status-dot"></span><span id="statusLabel">Connecting</span></span>
            <button class="icon-button topbar-share" id="shareChat" aria-label="Copy conversation" title="Copy conversation">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.7 6.8-4.4m-6.8 7 6.8 4"/></svg>
            </button>
          </div>
        </header>

        <section class="conversation" id="conversation" aria-live="polite">
          <div class="welcome" id="welcome">
            <div class="welcome-orb" aria-hidden="true"><span></span><span></span><span></span></div>
            <p class="eyebrow">A LITTLE MORE CLARITY</p>
            <h1>What’s on your mind?</h1>
            <p class="welcome-subtitle">A space to think, make, and figure things out.</p>
            <div class="suggestions">
              <button class="suggestion-card" data-prompt="Help me plan a focused, realistic week.">
                <span class="suggestion-icon lavender">✳</span><span><strong>Plan my week</strong><small>Make room for what matters</small></span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
              </button>
              <button class="suggestion-card" data-prompt="Give me a few creative ideas for my next project.">
                <span class="suggestion-icon peach">✦</span><span><strong>Find inspiration</strong><small>Get unstuck and explore ideas</small></span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
              </button>
              <button class="suggestion-card" data-prompt="Explain a tricky concept in simple terms.">
                <span class="suggestion-icon mint">◌</span><span><strong>Learn something</strong><small>Make the complex feel simple</small></span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
              </button>
              <button class="suggestion-card" data-prompt="Help me write a thoughtful message.">
                <span class="suggestion-icon blue">↗</span><span><strong>Write it better</strong><small>Find just the right words</small></span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
              </button>
            </div>
          </div>
          <div class="messages" id="messages"></div>
        </section>

        <footer class="composer-area">
          <form class="composer" id="chatForm">
            <textarea id="messageInput" rows="1" placeholder="Message…" aria-label="Message" maxlength="20000"></textarea>
            <div class="composer-bottom">
              <div class="composer-hint"><span class="sparkle">✳</span><span>Curious by design. Human by nature.</span></div>
              <div class="composer-actions">
                <span class="enter-hint">↵ to send</span>
                <button class="send-button" id="sendButton" type="submit" aria-label="Send message" disabled>
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 14-7-4 14-3-6-7-1Zm7 1 7-8"/></svg>
                </button>
              </div>
            </div>
          </form>
          <p class="disclaimer">AI can make mistakes. Check important information.</p>
        </footer>
      </main>
    </div>
    <div class="mobile-scrim" id="mobileScrim"></div>
    <div class="toast" id="toast" role="status"></div>
  </body>
</html>
